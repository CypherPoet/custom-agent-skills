name: Notify marketplace of plugin updates

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"

# This workflow needs MARKETPLACE_DISPATCH_TOKEN — a fine-grained PAT with
# `repo` scope (or contents:write + actions:write on the marketplace repo)
# stored as a repository secret. Without it, the dispatch step will fail
# but won't block the push.

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch at the marketplace repo
        run: |
          curl -fSsL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/CypherPoet/cypherpoet-toolchest/dispatches \
            -d '{"event_type":"plugin-updated","client_payload":{"source_repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
