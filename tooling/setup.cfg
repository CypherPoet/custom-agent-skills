[metadata]
name = cypherpoet-agent-skills-tooling
version = 0.1.1
description = Shared generation and validation tooling for CypherPoet agent-skill repositories
license = MIT

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cypherpoet-sync-plugins = cypherpoet_agent_skills_tooling.sync_plugins:console_main
